name: Build Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish DNVRR -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DNVRR-Portable
          path: DNVRR/bin/Release/net9.0-windows/win-x64/publish/DNVRR.exe

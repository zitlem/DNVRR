name: Build Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish DNVRR -c Release -r win-x64 --self-contained true -o publish-installer

      - name: Create Installer
        shell: pwsh
        run: |
          $version = (Select-Xml -Path DNVRR/DNVRR.csproj -XPath "//Version").Node.InnerText

          @"
          [Setup]
          AppName=DNVRR
          AppVersion=$version
          AppPublisher=DNVRR
          DefaultDirName={autopf}\DNVRR
          DefaultGroupName=DNVRR
          OutputDir=installer-output
          OutputBaseFilename=DNVRR-Setup-$version
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\DNVRR.exe

          [Files]
          Source: "publish-installer\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\DNVRR"; Filename: "{app}\DNVRR.exe"
          Name: "{autodesktop}\DNVRR"; Filename: "{app}\DNVRR.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\DNVRR.exe"; Description: "Launch DNVRR"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -Encoding UTF8 setup.iss

          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile is-setup.exe
          Start-Process -Wait -FilePath is-setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /DIR=C:\InnoSetup"
          & "C:\InnoSetup\ISCC.exe" setup.iss

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DNVRR-Installer
          path: installer-output/*.exe
